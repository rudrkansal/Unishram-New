name: labour_marketplace
description: "UniShram — India's unified labour ecosystem."
publish_to: 'none'
version: 1.5.1+12

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  provider: ^6.1.2
  shared_preferences: ^2.3.2

  # Voice: text-to-speech readout + spoken command control
  flutter_tts: ^4.0.2
  speech_to_text: ^7.0.0

  # Current location
  geolocator: ^13.0.1
  geocoding: ^3.0.0

  # Profile / work photos
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0
  firebase_storage: ^13.3.0
  firebase_messaging: ^16.2.0
  firebase_crashlytics: ^5.2.0
  firebase_analytics: ^12.3.0
  firebase_remote_config: ^6.3.0
  geoflutterfire_plus: ^0.0.34
  package_info_plus: ^9.0.1
  connectivity_plus: ^7.3.1
  basic_utils: ^5.8.2
  audioplayers: ^6.4.0
  http: ^1.6.0
  record: ^6.2.1
  path_provider: ^2.1.5
  firebase_app_check: ^0.4.8
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/branding/
